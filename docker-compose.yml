services:
  taoyuan:
    build:
      context: .
      dockerfile: Dockerfile
    image: taoyuan-duli:latest
    container_name: taoyuan
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_STORAGE: /app/data/.storage.json
    ports:
      - "${HOST_PORT:-4014}:4013"
    volumes:
      - ./data:/app/data
      - ./taoyuan-main/public/asset_fish_boss:/opt/taoyuan/asset_fish_boss:ro
      - ./taoyuan-main/public/crop:/opt/taoyuan/crop:ro
      - ./taoyuan-main/public/item:/opt/taoyuan/item:ro
      - ./taoyuan-main/public/npc:/opt/taoyuan/npc:ro
